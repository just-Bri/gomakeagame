# Create a GitHub Release for the engine Go module.
#
# Tags use the subdirectory module form: engine/v0.1.0
# Changelog is built from commits + diffstat since the previous *latest* release
# (falls back to the previous engine/v* tag, or the full history on the first release).
#
# New releases are NOT marked latest by default — use "Mark release latest".
name: Create release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver for the engine module (e.g. 0.1.0 or engine/v0.1.0)"
        required: true
        type: string
      target:
        description: "Git ref to tag (branch, SHA, or existing tag tip)"
        required: true
        default: main
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.target }}

      - name: Normalize tag
        id: meta
        env:
          RAW: ${{ inputs.version }}
        run: |
          set -euo pipefail
          v="${RAW#"${RAW%%[![:space:]]*}"}"
          v="${v%"${v##*[![:space:]]}"}"
          if [[ -z "$v" ]]; then
            echo "::error::version is empty"
            exit 1
          fi
          if [[ "$v" == engine/v* ]]; then
            tag="$v"
          elif [[ "$v" == v* ]]; then
            tag="engine/$v"
          else
            tag="engine/v$v"
          fi
          if [[ ! "$tag" =~ ^engine/v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::tag '$tag' is not valid engine semver (expected engine/vX.Y.Z)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using tag: $tag"

      - name: Resolve previous latest
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prev=""
          # Prefer the release GitHub currently marks as latest.
          if latest_json=$(gh api "repos/${{ github.repository }}/releases/latest" 2>/dev/null); then
            prev=$(jq -r '.tag_name // empty' <<<"$latest_json")
          fi
          # Fallback: newest engine/v* tag already on the remote.
          if [[ -z "$prev" ]]; then
            prev=$(git tag -l 'engine/v*' --sort=-v:refname | head -n1 || true)
          fi
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
          if [[ -n "$prev" ]]; then
            echo "Changelog base: $prev"
          else
            echo "No previous release/tag — changelog will cover full history to HEAD"
          fi

      - name: Generate changelog
        id: notes
        env:
          PREV: ${{ steps.prev.outputs.previous }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "## ${TAG}"
            echo
            echo "Go module: \`github.com/just-Bri/gomakeagame/engine@${TAG#engine/}\`"
            echo
            if [[ -n "$PREV" ]]; then
              echo "Changes since \`${PREV}\`:"
              echo
              echo "### Commits"
              echo
              if git rev-parse -q --verify "$PREV" >/dev/null; then
                git log --pretty=format:'- %s (%h)' "${PREV}..HEAD"
                echo
                echo
                echo "### Diffstat"
                echo
                echo '```'
                git diff --stat "${PREV}..HEAD"
                echo '```'
              else
                echo "_Previous tag ${PREV} is not in this clone; listing commits on HEAD only._"
                echo
                git log --pretty=format:'- %s (%h)' -n 50
                echo
              fi
            else
              echo "### Commits (initial release)"
              echo
              git log --pretty=format:'- %s (%h)'
              echo
              echo
              echo "### Diffstat"
              echo
              echo '```'
              git diff --stat $(git rev-list --max-parents=0 HEAD)..HEAD
              echo '```'
            fi
            echo
            echo "---"
            echo
            echo "Install:"
            echo
            echo '```bash'
            echo "go get github.com/just-Bri/gomakeagame/engine@${TAG#engine/}"
            echo '```'
          } > RELEASE_NOTES.md
          echo "Wrote RELEASE_NOTES.md"
          cat RELEASE_NOTES.md

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

          args=(release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md --verify-tag)
          # Keep new cuts off "latest" so promotion is explicit via the other workflow.
          args+=(--latest=false)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
