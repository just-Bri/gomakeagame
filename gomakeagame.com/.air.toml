root = "."
tmp_dir = "tmp"

[build]
  pre_cmd = ["go generate"]
  cmd = "go build -o ./tmp/main ."
  entrypoint = ["./tmp/main"]
  include_ext = ["go", "tpl", "tmpl", "html", "templ"]
  exclude_dir = ["assets", "tmp", "vendor", "bin"]
  exclude_regex = ["_test.go", ".*_templ.go"]
  exclude_unchanged = false
  follow_symlink = false
  log = "build-errors.log"
  delay = 500
  stop_on_error = true
  send_interrupt = false
  kill_delay = 500

[build.windows]
  pre_cmd = ["go generate"]
  cmd = "go build -o ./tmp/main.exe ."
  entrypoint = ["tmp\\main.exe"]

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
