<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 48 280 252" width="100%" height="100%">
  <g transform="translate(60, 90)">
    <defs>
      <linearGradient id="logo-gradient" gradientUnits="userSpaceOnUse" x1="0" y1="-42" x2="0" y2="210">
        <stop offset="0%" stop-color="#34d399"/>
        <stop offset="40%" stop-color="#2dd4bf"/>
        <stop offset="100%" stop-color="#60a5fa"/>
      </linearGradient>
    </defs>
    <style>
      .glyph {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 52px;
        text-anchor: middle;
        fill: url(#logo-gradient);
      }
    </style>

    <text x="0"   y="0" class="glyph">G</text>
    <text x="60"  y="0" class="glyph">o</text>
    <text x="120" y="0" class="glyph">m</text>
    <text x="180" y="0" class="glyph">a</text>
    <text x="240" y="0" class="glyph">g</text>

    <text x="120" y="65"  class="glyph">a</text>
    <text x="120" y="130" class="glyph">k</text>
    <text x="120" y="195" class="glyph">e</text>

    <text x="240" y="65"  class="glyph">a</text>
    <text x="240" y="130" class="glyph">m</text>
    <text x="240" y="195" class="glyph">e</text>
  </g>
</svg>
