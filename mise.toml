[tools]
go = "1.27.1"
"go:github.com/a-h/templ/cmd/templ" = "latest"
"go:github.com/air-verse/air" = "latest"

[tasks.site]
description = "Run the gomakeagame.com website locally"
dir = "gomakeagame.com"
run = ["templ generate", "go run ."]

[tasks.air]
description = "Run the website with hot reload"
dir = "gomakeagame.com"
run = "air"

[tasks.hello2d]
description = "Run the engine gogpu+gg smoke window"
dir = "engine"
env = { CGO_ENABLED = "0" }
run = "go run ./examples/hello2d"

[tasks.engine-test]
description = "Run engine unit tests (CGO off)"
dir = "engine"
env = { CGO_ENABLED = "0" }
run = "go test ./..."

